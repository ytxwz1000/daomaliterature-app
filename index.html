x;margin-bottom:11px">近 14 天阅读分钟</div><div class="trend" id="trend14" style="margin-top:16px;padding-bottom:20px"></div></div><div class="card"><div class="sub" style="font-weight:700;letter-spacing:1px;margin-bottom:11px">各文献累计阅读时长 TOP 5</div><div class="bars" id="bookBars" style="margin-top:11px"></div></div><div class="card"><div class="sub" style="font-weight:700;letter-spacing:1px;margin-bottom:11px">每日在读 / 已读（最近 14 天）</div><div id="statusTrend" style="margin-top:11px"></div><div class="hint" style="margin:8px 0 0">绿条＝在读篇数，灰条＝已读完篇数。每次数据变动都会自动记录当天状态。</div></div><button class="btn gh blk" onclick="exportData()">⬇ 导出全部数据（JSON 备份）</button><div style="height:10px"></div><button class="btn gh blk" onclick="importData()">⬆ 导入备份</button><input type="file" id="fileIn" accept=".json" style="display:none" onchange="doImport(event)"><p class="hint" style="margin-top:12px">数据仅保存在这台设备的浏览器本地，不会上传。统计数据由打卡记录实时计算，打卡后、回到页面或跨天时自动更新。换手机或清理浏览器数据前，记得先导出备份。</p></section></main><button class="fab" onclick="fabClick()" title="新建">+</button><!-- 添加/编辑文献 --><div class="mask" id="mask" onclick="if(event.target===this)closeSheet()"></div><div class="sheet" id="sheet"><div class="grab"></div><div class="sh" id="sheetBody"></div></div><div class="toast" id="toast"></div><input type="file" id="imgIn" accept="image/*" style="display:none" onchange="doImg(event)"><input type="file" id="coverIn" accept="image/*" style="display:none" onchange="doCover(event)"><script>/* ================= 数据层 ================= */ const KEY='litlog.v1';const DEF={books:[],logs:[],notes:[],posts:[],quotes:[],daily:[],profile:{name:'我',goal:20}};let S=load();function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.books){const o=Object.assign({},DEF,d);if(!Array.isArray(o.notes))o.notes=[];if(!Array.isArray(o.posts))o.posts=[];if(!Array.isArray(o.quotes))o.quotes=[];o.daily=Array.isArray(d.daily)?d.daily.slice():[];return o;}}catch(e){}return JSON.parse(JSON.stringify(DEF));}function snapshotToday(){if(!Array.isArray(S.daily))S.daily=[];const d=today(),t=Date.now();const rec={day:d,reading:S.books.filter(b=>b.status==='reading').length,want:S.books.filter(b=>b.status==='want').length,done:S.books.filter(b=>b.status==='done').length,ts:t};const i=S.daily.findIndex(x=>x.day===d);if(i>=0)S.daily[i]=rec;else S.daily.push(rec);if(S.daily.length>400)S.daily=S.daily.slice(-400);}function save(){snapshotToday();localStorage.setItem(KEY,JSON.stringify(S));}const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const COLORS=['#2f7a56','#3d6a9e','#9a5b3f','#7b5aa6','#b8863b','#3f8f8f','#a4475f','#5c7a3a'];/* ================= 工具 ================= */ const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dk(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}const today=()=>dk(new Date());function niceDate(s){const t=today(); if(s===t)return '今天';const y=dk(Date.now()-864e5); if(s===y)return '昨天';const p=String(s||'').split('-'); return p.length===3?p[1]+'月'+p[2]+'日':(s||'');}function mdDate(s){const p=String(s||'').split('-');return p.length===3?(+p[1])+'月'+(+p[2])+'日':(s||'');}function clock(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1900);}function init0(s){return s.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'文';}function book(id){return S.books.find(b=>b.id===id)||{title:'（已删除）',author:'',color:'#999'};}function logsOf(id){return S.logs.filter(l=>l.bid===id).sort((a,b)=>b.ts-a.ts);}function minsOn(d){return S.logs.filter(l=>l.day===d).reduce((s,l)=>s+(+l.min||0),0);}function streak(){let n=0,d=new Date();if(minsOn(dk(d))===0)d=new Date(d-864e5);while(minsOn(dk(d))>0){n++;d=new Date(d-864e5);}return n;}function totalMin(){return S.logs.reduce((s,l)=>s+(+l.min||0),0);}/* ===== 农历 1900-2100 ===== */const LI=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,0x0d520];const MN=['正','二','三','四','五','六','七','八','九','十','十一','十二'];const DN=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];function leapMonth(y){return LI[y-1900]&0xf;}function leapDays(y){return leapMonth(y)?((LI[y-1900]&0x10000)?30:29):0;}function monthDays(y,m){return (LI[y-1900]&(0x10000>>m))?30:29;}function yearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(LI[y-1900]&i)?1:0;return s+leapDays(y);}function lunarText(dt){const y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();if(y<1900||y>2100)return '';let off=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000),i,tmp=0;for(i=1900;i<2101&&off>0;i++){tmp=yearDays(i);off-=tmp;}if(off<0){off+=tmp;i--;}const ly=i,leap=leapMonth(ly);let isLeap=false;for(i=1;i<13&&off>0;i++){if(leap>0&&i===leap+1&&!isLeap){--i;isLeap=true;tmp=leapDays(ly);}else tmp=monthDays(ly,i);if(isLeap&&i===leap+1)isLeap=false;off-=tmp;}if(off===0&&leap>0&&i===leap+1){if(isLeap)isLeap=false;else{isLeap=true;--i;}}if(off<0){off+=tmp;--i;}return (isLeap?'闰':'')+MN[i-1]+'月'+DN[off];}/* 封面：image=上传图片 / title=直接显示标题 / spine=彩色书脊 */ function coverHTML(b,cls){const m=b.coverMode||'spine';if(m==='image'&&b.coverImg)return `<div class="${cls} cvimg"><img src="${b.coverImg}" alt=""></div>`;if(m==='title')return `<div class="${cls} cvtitle" style="background:${b.color}">${esc(b.title)}</div>`;return `<div class="${cls}" style="background:${b.color}">${esc(init0(b.title))}</div>`;}/* ================= 视图切换 ================= */ let cur='today';function go(t){cur=t;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.t===t));document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+t));window.scrollTo({top:0,behavior:'smooth'});render();}function goShelf(st){filter=st;go('shelf');}function render(){if(cur==='today')rToday();if(cur==='shelf')rShelf();if(cur==='feed')rFeed();if(cur==='stat')rStat();}/* ================= 今日 ================= */ function rToday(){const d=new Date(), w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];$('hDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 · '+w+' · 农历'+lunarText(d);const m=minsOn(today());$('hMin').innerHTML=m>0?(m+'<i>分钟</i>'):'';$('hMin').style.display=m>0?'block':'none';/* 近7天圆点 */ let dots='';for(let i=6;i>=0;i--){const day=dk(Date.now()-i*864e5), v=minsOn(day);dots+='<div class="dot'+(v>0?' f':'')+'" title="'+day+' '+v+'分钟"></div>';}$('hDots').innerHTML=dots;const rd=S.books.filter(b=>b.status==='reading').length,dn=S.books.filter(b=>b.status==='done').length;$('kBook').textContent=rd;$('kDone').textContent=dn;$('kNote').textContent=S.notes.length+S.logs.filter(l=>l.note&&l.note.trim()).length;const tc=S.logs.filter(l=>l.day===today()).length;$('todayStatus').innerHTML=`今日打卡 <b style="color:var(--green)">${tc}</b> 次 · 在读 <b style="color:var(--green)">${rd}</b> 篇 · 已读完 <b style="color:var(--green)">${dn}</b> 篇 · 状态每日自动记录到统计页`;const reading=S.books.filter(b=>b.status==='reading').sort((a,b)=>(b.lastTs||0)-(a.lastTs||0));$('readingList').innerHTML = reading.length? reading.map(b=>{const ls=logsOf(b.id);const todayMin=ls.filter(l=>l.day===today()).reduce((s,l)=>s+(+l.min||0),0);return `<div class="card book" onclick="detail('${b.id}')">${coverHTML(b,'cover')}<div class="grow"><div class="stitle ell">${esc(b.title)}</div><div class="sub ell">${esc(b.author||'佚名')}${b.type?' · '+esc(b.type):''}${todayMin?' · <b style="color:var(--green)">今日 '+todayMin+' 分钟</b>':''}</div></div><button class="btn sm" onclick="event.stopPropagation();openLog('${b.id}')" style="align-self:center">打卡</button></div>`;}).join('') : `<div class="card empty" style="padding:26px"><div>☕</div>还没有在读的文献<br><button class="btn sm" style="margin-top:12px" onclick="openBook()">去添加</button></div>`;const rn=[...S.notes].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,5);$('recentNotes').innerHTML = rn.length? rn.map(noteItem).join(''): `<div class="card empty" style="padding:24px"><div>✍️</div>还没有随手笔记<br>点上方「+ 添加笔记」记一条</div>`;rDailyQuote();}/* ===== 每日马恩经典语录（按日期固定，可换一句） ===== */let dqIdx=null;function dailyQuotePool(){return QUOTES.filter(q=>q.g==='马恩经典');}function rDailyQuote(){const pool=dailyQuotePool();if(!pool.length)return;if(dqIdx===null){const d=new Date();dqIdx=(d.getFullYear()*372+d.getMonth()*31+d.getDate())%pool.length;}const q=pool[dqIdx%pool.length];$('hQuote').innerHTML=`<div class="qt">「${esc(q.t)}」</div><div class="qm"><span class="ref">— ${esc(q.a)}　${esc(q.s||'')}</span><button class="qnext" onclick="nextDailyQuote()">换一句 ↻</button></div>`;}function nextDailyQuote(){const pool=dailyQuotePool();if(!pool.length)return;dqIdx=(dqIdx+1)%pool.length;rDailyQuote();}/* ================= 书架：豆瓣式单列列表 ================= */ let filter='all';const FIL=[['all','全部'],['reading','在读'],['want','想读'],['done','已读']];function rShelf(){$('filters').innerHTML=FIL.map(f=>{const n=f[0]==='all'?S.books.length:S.books.filter(b=>b.status===f[0]).length;return `<button class="fbtn ${filter===f[0]?'on':''}" onclick="filter='${f[0]}';rShelf()">${f[1]} ${n}</button>`;}).join('');const list=S.books.filter(b=>filter==='all'||b.status===filter).sort((a,b)=>(b.lastTs||0)-(a.lastTs||0));$('shelfCnt').textContent='共 '+S.books.length+' 篇文献';$('shelfEmpty').style.display=list.length?'none':'block';$('grid').innerHTML=list.map(b=>{const bd={reading:['在读','var(--green)'],want:['想读','#b9791c'],done:['已读','#8d8a83']}[b.status]||['在读','var(--green)'];const meta=[b.author||'佚名',b.year,b.type,b.journal,b.issue].filter(Boolean).join(' / ');return `<div class="si" onclick="detail('${b.id}')"><div class="top">${coverHTML(b,'cv')}<div class="in"><div class="ti">${esc(b.title)}</div><div class="mt">${esc(meta)}</div></div></div><div class="bt"><span>${mdDate(b.statusDay||b.created||'')} <b style="color:${bd[1]}">${bd[0]}</b>${b.rating?` <span style="margin-left:6px;color:#e8a33d;font-weight:800">★ ${b.rating}</span>`:''}</span><span class="ops"><button class="op" onclick="event.stopPropagation();moreSheet('${b.id}')" title="更多操作">···</button></span></div></div>`;}).join('');}/* ================= 动态 ================= */ function logItem(l){const b=book ="sec-t">导出我的笔记</div><div class="hint" style="margin-top:-2px">把随手笔记和打卡笔记整理成带日期、关联文献、标签的文档，可导入 Obsidian、粘贴进 Word，或打印成 PDF。</div><button class="btn blk" onclick="exportNotes('md')">⬇ 导出笔记 · Markdown（推荐）</button><div style="height:8px"></div><button class="btn gh blk" onclick="exportNotes('html')">⬇ 导出笔记 · 排版网页（可打印）</button><div class="hint" style="margin-top:12px">数据仍只保存在本机浏览器。换设备前请先用统计页的「导出全部数据」做备份。</div>`);}function allNoteEntries(){const out=[];S.notes.forEach(n=>{let txt=n.text||'';if(n.quote)txt='「'+n.quote+'」\n'+txt;out.push({day:n.day||dk(n.ts),time:n.time||'',bid:n.bid||'',title:n.title||'',text:txt,tags:n.tags||[],kind:'随手笔记',ts:n.ts||0});});S.logs.forEach(l=>{const p=[];if(l.quote)p.push('「'+l.quote+'」');if(l.note)p.push(l.note);if(p.length)out.push({day:l.day||'',time:l.time||'',bid:l.bid||'',title:'',text:p.join('\n'),tags:l.tags||[],kind:'打卡笔记',ts:l.ts||0});});out.sort((a,b)=>((a.day||'')+(a.time||'')).localeCompare((b.day||'')+(b.time||'')));return out;}function exportNotes(fmt){const es=allNoteEntries();if(!es.length){toast('还没有笔记可导出');return;}const bname=id=>id?book(id).title:'';if(fmt==='md'){let md='# 文献阅读笔记\n\n';md+='> 导出时间：'+new Date().toLocaleString('zh-CN')+' · 共 '+es.length+' 条笔记 · 累计阅读 '+totalMin()+' 分钟\n\n';let day='';es.forEach(e=>{if(e.day!==day){day=e.day;md+='## '+day+'\n\n';}const title=e.title||(e.bid?'《'+bname(e.bid)+'》':'随手笔记');md+='### '+(e.time?e.time+' · ':'')+title+'（'+e.kind+'）\n\n';if(e.bid)md+='- 关联文献：《'+bname(e.bid)+'》\n';if(e.tags&&e.tags.length)md+='- 标签：'+e.tags.map(t=>'#'+t).join(' ')+'\n';md+='\n'+e.text+'\n\n---\n\n';});dlFile('文献笔记_'+today()+'.md','\ufeff'+md,'text/markdown;charset=utf-8');}else{const rows=es.map(e=>{const title=e.title||(e.bid?'《'+esc(bname(e.bid))+'》':'随手笔记');return `<section class="nt"><div class="meta"><span>${esc(e.day)} ${esc(e.time)}</span><span class="kind">${e.kind}</span></div><h3>${esc(title)}</h3>${e.bid?`<p class="bk">关联文献：《${esc(bname(e.bid))}》</p>`:''}${e.tags&&e.tags.length?`<p class="tg">${e.tags.map(t=>'<span>#'+esc(t)+'</span>').join('')}</p>`:''}<div class="bd">${esc(e.text).replace(/\n/g,'<br>')}</div></section>`;}).join('');const html=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>文献阅读笔记 · ${today()}</title><style>body{max-width:760px;margin:40px auto;padding:0 24px;color:#1f1e1c;font:16px/1.85 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}h1{font-size:28px;border-bottom:3px solid #2f7a56;padding-bottom:12px}.info{color:#8d8a83;font-size:13px;margin-bottom:32px}.nt{border:1px solid #ebe8e1;border-left:4px solid #2f7a56;border-radius:10px;padding:16px 18px;margin-bottom:16px;page-break-inside:avoid}.meta{display:flex;justify-content:space-between;color:#8d8a83;font-size:12px}.kind{background:#e8f2ec;color:#2f7a56;padding:1px 8px;border-radius:20px;font-weight:700}.nt h3{font-size:17px;margin:8px 0 6px}.bk,.tg{font-size:13px;color:#6b6861;margin:3px 0}.tg span{background:#f0eee9;color:#6b6861;padding:2px 8px;border-radius:20px;margin-right:6px}.bd{white-space:normal;margin-top:10px;color:#3d3a35}@media print{body{margin:0;padding:0;font-size:12pt}.nt{border-color:#ccc}}</style></head><body><h1>文献阅读笔记</h1><div class="info">导出时间：${new Date().toLocaleString('zh-CN')} · 共 ${es.length} 条笔记 · 累计阅读 ${totalMin()} 分钟</div>${rows}</body></html>`;dlFile('文献笔记_'+today()+'.html',html,'text/html;charset=utf-8');}toast('笔记已导出');}function dlFile(name,txt,type){const b=new Blob([txt],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}/* ================= 导入导出 ================= */ function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='文献打卡备份_'+today()+'.json';a.click();toast('备份已导出');}function importData(){$('fileIn').click();}function doImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.books)throw 0;confirmSheet('导入备份','导入将覆盖当前全部数据，确定继续吗？建议先导出一份备份。',()=>{S=Object.assign({},DEF,d);if(!Array.isArray(S.notes))S.notes=[];if(!Array.isArray(S.posts))S.posts=[];if(!Array.isArray(S.quotes))S.quotes=[];S.daily=Array.isArray(d.daily)?d.daily.slice():[];save();render();toast('导入成功');},'确认导入');}catch(err){toast('文件格式不对');}};r.readAsText(f);e.target.value='';}/* ================= 自动更新 ================= */ let _lastDay=today();function checkDay(){const d=today();if(d!==_lastDay){_lastDay=d;render();toast('新的一天，数据已更新');}}setInterval(checkDay,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay();});window.addEventListener('storage',()=>{S=load();render();});/* ================= 启动 ================= */(function boot(){/* 首次使用放 3 篇示例，帮用户看懂怎么用 */ if(!localStorage.getItem(KEY)){const t=Date.now();S.books=[{id:'s1',title:'走向历史的深处：马克思历史观研究',author:'陈先达',year:'2016',type:'专著/图书',journal:'中国人民大学出版社',doi:'',total:15,pages:15,status:'done',tags:'历史唯物主义 精读',note:'示例：马克思历史观研究，可用「显示标题」做封面。',color:'#b8863b',coverMode:'title',coverImg:'',lastTs:t-864e5*2,created:dk(Date.now()-864e5*2)},{id:'s2',title:'意识形态论',author:'俞吾金',year:'2009',type:'专著/图书',journal:'人民出版社',doi:'',total:32,pages:14,status:'reading',tags:'方法论 精读',note:'示例条目，了解用法后可长按删除。',color:COLORS[0],coverMode:'spine',coverImg:'',lastTs:t-864e5,created:dk(Date.now()-864e5)},{id:'s3',title:'想读：一篇综述',author:'—',year:'',type:'期刊论文',journal:'',doi:'',total:0,pages:0,status:'want',tags:'',note:'',color:COLORS[3],coverMode:'spine',coverImg:'',lastTs:t,created:today()}];S.logs=[{id:'l1',bid:'s1',day:dk(Date.now()-864e5*2),time:'21:10',min:45,pages:11,quote:'',note:'第 3 节值得反复看。',tags:['精读'],img:'',ts:t-864e5*2},{id:'l2',bid:'s1',day:dk(Date.now()-864e5*2),time:'22:02',min:30,pages:15,quote:'',note:'读完，整体框架理清了。',tags:['精读'],img:'',ts:t-864e5*2+3e6},{id:'l3',bid:'s2',day:dk(Date.now()-864e5),time:'20:30',min:25,pages:14,quote:'先把文本读通，再谈评价。',note:'',tags:['方法论'],img:'',ts:t-864e5}];S.notes=[];save();}render();})();</script></body></html>
